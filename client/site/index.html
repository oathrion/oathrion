<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!--
      Trois familles, pas vingt-cinq.

      `client/index.html` charge 25 familles Google Fonts pour la console — un héritage
      qui coûte plusieurs centaines de kilo-octets avant le premier pixel. Le site public
      est la page qu'un inconnu charge sur un réseau inconnu : il porte exactement les
      trois familles qu'il emploie — une d'affichage, une de texte, une à chasse fixe —
      avec `display=swap` et les deux préconnexions.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Source+Sans+3:wght@400;500;600&family=Source+Code+Pro:wght@400;500&display=swap"
    />

    <title>Oathrion — The control plane for autonomous AI agents</title>
    <meta
      name="description"
      content="Oathrion decides whether an AI agent may act — before the action reaches a tool. Identity, policy, mandate, risk, decision, approval, execution, audit. Self-hosted, verifiable, tamper-evident."
    />
    <link rel="canonical" href="https://example.invalid/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#FAFAF7" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oathrion" />
    <meta property="og:title" content="Oathrion — The control plane for autonomous AI agents" />
    <meta
      property="og:description"
      content="An agent with an API key can spend your money. Oathrion puts the decision outside the agent: every action is authorized before it reaches a tool, and every decision leaves a tamper-evident trace."
    />
    <meta property="og:url" content="https://example.invalid/" />
    <!--
      L'aperçu de lien. `og:image` doit être une URL ABSOLUE : un chemin relatif
      fonctionne dans le navigateur et échoue silencieusement chez tous les lecteurs
      d'aperçu, qui ne connaissent pas la page d'origine. Les dimensions sont déclarées
      pour que l'emplacement soit réservé avant le téléchargement, et `og:image:alt`
      existe parce qu'un aperçu est aussi lu à voix haute.
    -->
    <meta property="og:image" content="https://example.invalid/img/og-2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Oathrion. Your coding agent asks before it breaks things. npx oathrion" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oathrion — The control plane for autonomous AI agents" />
    <meta
      name="twitter:description"
      content="An agent with an API key can spend your money. Oathrion puts the decision outside the agent."
    />
    <meta name="twitter:image" content="https://example.invalid/img/og-2.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Oathrion",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Linux, macOS, Windows",
        "description": "Open source. One command puts a check between an AI coding agent (Claude Code, Cursor) and the tools it uses: reads go through, writes wait for your approval, deletes outside the project are refused, and every action leaves a signed receipt.",
        "url": "https://example.invalid/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/site/main.tsx"></script>
  </body>
</html>
