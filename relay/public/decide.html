<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06071c">
<title>Oathrion · Decide</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
<script src="/common.js" defer></script>
<script src="/decide.js" defer></script>
</head>
<body>
<main>
  <div class="brand"><img src="/icon.png" alt=""> Oathrion</div>

  <section class="card" id="card">
    <div class="who">
      <div class="ring small"><div class="inner"><img id="face" src="/icon.png" alt=""></div></div>
      <div>
        <div class="name" id="agent">Oathrion</div>
        <div class="muted small" id="where"></div>
      </div>
    </div>
    <h1 id="title" style="margin:16px 0 0;font-size:21px"></h1>
    <div class="cmd" id="cmd" hidden></div>
    <p id="body" class="muted" style="white-space:pre-line;margin:8px 0 0"></p>
    <div id="buttons"></div>
  </section>

  <section class="card done" id="done" hidden>
    <div class="big pop">✓</div>
    <h1 id="done-title" style="font-size:22px">Sent</h1>
    <p class="muted" id="done-text">Your computer has your answer.</p>
    <div id="feedback" hidden>
      <p style="margin-bottom:0">Was this right?</p>
      <div class="row"><button class="ghost" data-choice="right">👍 Yes</button><button class="ghost" data-choice="wrong">👎 No</button></div>
    </div>
  </section>

  <p id="status" class="muted center" aria-live="polite"></p>

  <section class="card" id="quick-card" style="margin-top:28px">
    <label style="display:flex;gap:12px;align-items:flex-start;margin:0;color:var(--ink)">
      <input type="checkbox" id="quick" style="width:22px;height:22px;margin:2px 0 0;flex-shrink:0">
      <span>Answer right in the notification<br><span class="muted small">Chrome may warn about the first one: choose to see it, then to always allow Oathrion.</span></span>
    </label>
  </section>
</main>
</body>
</html>
