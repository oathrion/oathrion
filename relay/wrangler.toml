# Le relais du téléphone sur Cloudflare (relay/README.md). Aucun secret ici :
# `bash relay/script/deploy.sh` les tire et les envoie.
name = "oathrion-relay"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

routes = [{ pattern = "relay.oathrion.com", custom_domain = true }]

# La page du téléphone, son service worker, son icône.
[assets]
directory = "public"

[vars]
BOT_USERNAME = "OathrionBot"
PUBLIC_URL = "https://relay.oathrion.com"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "MachineRoom"

[[durable_objects.bindings]]
name = "REVOCATIONS"
class_name = "RevocationList"

# Des Durable Objects SQLite : disponibles dans l'offre gratuite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MachineRoom", "RevocationList"]

# Dix nouvelles connexions par minute et par adresse IP.
[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
