# Oathrion — PILE PILOTE LOCALE. Une commande, rien à remplir.
#
#   npm run pilot:up      # génère les secrets, construit, démarre, attend /api/ready
#   npm run pilot:down    # arrête les conteneurs — les données sont CONSERVÉES
#   npm run pilot:destroy # arrête ET SUPPRIME le volume de données (irréversible)
#
#   OATHRION_PILOT_PORT=5055 npm run pilot:up    # si 5000 est déjà pris
#
# ## CE FICHIER N'EST PAS UNE CONFIGURATION DE PRODUCTION
#
# Il existe parce que `docker-compose.yml` ne peut pas démarrer sans qu'un humain
# remplisse `placet.env` et possède un nom de domaine : c'est correct pour un
# déploiement, et c'est un obstacle pour quelqu'un qui veut voir le produit tourner.
#
# Les différences avec la pile de production, toutes délibérées :
#
#   · PAS DE TLS. Pas de proxy Caddy, pas de HSTS, pas de certificat. Le serveur écoute
#     en HTTP sur 127.0.0.1:5000. Un credential qui traverse ce port traverse du clair,
#     donc cette pile ne doit porter aucune donnée réelle.
#   · PostgreSQL est PUBLIÉ sur 127.0.0.1:55433, pour qu'un pilote puisse inspecter sa
#     base avec `psql`. La production ne le publie pas du tout.
#   · Les secrets sont GÉNÉRÉS par le script et écrits dans `deploy/placet.local.env`
#     en mode 600. Frais à chaque passage, jamais versionnés.
#
# Le durcissement qui ne coûte rien est conservé : rootfs en lecture seule, utilisateur
# non root, `no-new-privileges`, et la migration ponctuelle garde toujours le démarrage.
# Ce qui tombe ici, c'est le TLS et l'isolement réseau — pas la posture du processus.
name: placet-local

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: placet
      POSTGRES_USER: placet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?lancez npm run pilot:up, qui génère ce fichier}
    ports:
      # Sur 127.0.0.1 seulement : joignable depuis la machine, pas depuis le réseau.
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placet -d placet"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Un seul passage, AVANT le serveur. Oathrion refuse de démarrer sur un schéma non
  # migré ou plus récent que lui : c'est cette étape qui le prépare, et `depends_on`
  # avec `service_completed_successfully` est ce qui garantit l'ordre.
  migrate:
    image: placet-local:latest
    build:
      context: ..
    command: ["node", "dist/migrate.cjs"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://placet:${POSTGRES_PASSWORD}@postgres:5432/placet
    read_only: true

  placet:
    image: placet-local:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: placet.local.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      # 0.0.0.0 DANS le conteneur, pour que la publication de port l'atteigne ; sur
      # l'hôte, cette publication est limitée à 127.0.0.1 (voir `ports` ci-dessous).
      OATHRION_HOST: "0.0.0.0"
      # Tous les plans sur PostgreSQL. Le serveur refuse de démarrer autrement, et
      # c'est la même configuration que la production : un pilote qui valide ici valide
      # le vrai moteur, pas SQLite.
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://placet:${POSTGRES_PASSWORD}@postgres:5432/placet
      OATHRION_IDENTITY_PLANE: postgres
      OATHRION_ACTION_AUTHORITY_DRIVER: postgres
      RATE_LIMIT_STORE: postgres
      # AUCUN proxy devant : les adresses clientes sont celles de la socket. Mettre
      # `1` ici sans proxy ferait confiance à un X-Forwarded-For envoyé par le client.
      OATHRION_TRUST_PROXY: "0"
    ports:
      # Le port HÔTE est réglable, le port du conteneur ne l'est pas. Un pilote dont la
      # machine occupe déjà 5000 — le défaut d'une instance Oathrion lancée à la main, donc
      # un conflit très probable — change `OATHRION_PILOT_PORT` et rien d'autre.
      - "127.0.0.1:${OATHRION_PILOT_PORT:-${PLACET_PILOT_PORT:-5000}}:5000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # `/api/ready` et non `/api/live` : prêt veut dire « la base répond », ce qui est
      # la question qu'un orchestrateur doit poser avant d'envoyer du trafic.
      test: ["CMD-SHELL", "node -e \"require('node:http').get('http://127.0.0.1:5000/api/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 4s
      retries: 24

volumes:
  pgdata_local:
